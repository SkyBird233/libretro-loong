<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>libretro-loong</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <img src="images/menu_quickmenu.svg" />
        <span>{{ pageTitle }}</span>
      </div>
      <span>{{ headerText }}</span>
    </header>

    <div class="main-container">
      <nav>
        <ul>
          {% for nav in navs %}
          <li>
            <a
              href="{{ nav.url }}"
              class="{% if currentNav == nav.url %}current{% endif %}"
            >
              <img src="{{ nav.iconUrl }}" />
              <span>{{ nav.name }}</span>
            </a>
          </li>
          {% endfor %}
        </ul>
      </nav>
      <main>
        {% block main %}
        <div class="index">
          <div class="banner">
            <img src="images/menu_quickmenu.svg" />
            <h1>libretro-loong</h1>
          </div>
          <ul class="links">
            <li>
              <a
                href="https://www.libretro.com/index.php/home-2/"
                target="_blank"
              >
                官方网站
              </a>
            </li>
            <li>
              <a href="quickstart.html">快速开始</a>
            </li>
            <li>
              <a href="cores.html">核心下载</a>
            </li>
          </ul>
        </div>
        {% endblock %}
      </main>
    </div>

    <footer>
      <a href="https://github.com/SkyBird233/libretro-loong" target="_blank">
        libretro-loong (GitHub)
      </a>
    </footer>
  </body>
</html>
